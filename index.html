## 我的理念

- **AI是非常强大的武器**：AI 是最好的科技武器，是获取压倒性优势的战略工具。但是善用者获胜，未来属于善于挥动这把剑的年轻人。
- **人人都是产品经理**：AI 只是工具，真正需要修炼的是判断和解决问题的能力。每个人都是自己的产品经理。
- **拿出结果才算数**：做不成的方案，讲得再漂亮也是零。我们看落地和实操，我只分享我做过和在做的项目，讲述我是踩坑的。
