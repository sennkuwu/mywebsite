# 01 · 关于我

## 定位

> 用AI搭建从0-100的AI赚钱系统，探索普通人的财富自由之路

## 简介

我是子扬，01年，前 AI 产品经理，辞职投入AI怀抱。我在做的事：把 AI 接进自己的日常工作流——筛选信息、搭系统、做项目，把真实项目过程和踩坑经历全部公开。

不追新工具，不堆信息。我的原则是先把问题看清楚，再决定做不做、怎么做最省力，探索普通人最有效的行动路线。

## 我的理念

- **AI 的用武之地**：不是生成内容，而是替人做重复、确定、耗时的劳动，让人有时间做判断。
- **人人都是需求工程师**：让 AI 写脚本的关键不是会编程，而是能把需求讲清楚。
- **做得成才算数**：做不成的方案，讲得再漂亮也是零。看落地和实操。

## 里程碑

- **daily-report 每日要闻系统** — Bloomberg 风格全球要闻，每天自动生成，信息可追溯。
- **闲鱼运营流量打法** — 确保店铺曝光，开启你的闲鱼交易。
- **这个网站** — 把项目、能力、文章接成一个能用的系统。

# 02 · 项目

## daily-report 每日要闻系统

Bloomberg 风格的全球要闻，每天自动生成一份。只收录会重塑预期的大事，找不到就宁缺毋滥。

- 七大模块：今日头条 / 国际 / 大中华 / 市场概览 / 经济日程 / 央行动态 / 今日图表
- 每条新闻标注来源 + 日期 + 链接，可追溯
- 时效优先 24 小时内，最多不超过 72 小时


## GPT代充和AI中转解决方案
- 闲鱼运营方案，确保店铺曝光和推流
- 有成熟的GPT代充方案，支持质保
- 先进的AI中转解决方案，助力于AI智能普及
